<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f172a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Campo · Teste de Bandeja</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;--ac:#059669;--ok:#059669;--wa:#d97706;--er:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--ac:#10b981;--ok:#10b981;--wa:#f59e0b;--er:#ef4444;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--ac:#10b981;--ok:#10b981;--wa:#f59e0b;--er:#ef4444;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
h1,h2{margin:6px 0 12px}h1{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.tap{cursor:pointer}small,.mut{color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0}
input,select{width:100%;box-sizing:border-box;font-size:16px;padding:10px;margin-top:4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px}.chk input{width:auto;margin:0}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sg label{margin:0}.sg input{text-align:center;padding:8px 2px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:10px}
.sm{flex:0 0 auto;padding:10px 12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.lnk{background:none;border:0;color:var(--ac);font-size:16px;padding:6px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;cursor:pointer;font-size:14px;line-height:1.25}.tile svg{width:52%;max-width:92px;stroke:var(--ac);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:34px;font-weight:800}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:17px;padding:16px 4px}
#mapv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:5;background:#1e293b;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#mtiles{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0}
#mmark{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mfab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mfab svg,.msb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msb{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35)}.msb svg{width:20px;height:20px}
.mtop{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top,0px))}
.mlb.on,#mrb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mpop{position:fixed;z-index:11;right:64px;transform:translateX(calc(100% + 70px));transition:transform .2s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}.mpop.on{transform:none}
#mmeas{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none}
#mdock{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:0 10px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#mdock button,#mdock .mpanel{pointer-events:auto}
.mrow{display:flex;justify-content:flex-end;gap:8px}
.mpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.mbar{display:flex;gap:8px;align-items:stretch}.mco{flex:1;min-width:0}.mcol{width:auto!important;margin:0!important;flex:0 0 auto;padding:0 18px!important;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:88%;overflow:auto;box-sizing:border-box;background:var(--card);color:var(--ink);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.mban{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top,0px));left:66px;right:66px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;text-align:center;display:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mattr{position:fixed;z-index:9;top:calc(18px + env(safe-area-inset-top,0px));left:66px;right:66px;text-align:center;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
#mtoast{position:fixed;z-index:12;top:calc(124px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:88%;background:var(--card);color:var(--ink);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;font-size:14px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
</style></head><body><div id="app"></div>
<script>
let S;try{S=JSON.parse(localStorage.getItem("campo_v1"))}catch(e){}
S=S||{brands:["RoGator","John Deere","Case IH","Jacto","New Holland","Stara"],products:["Super Simples","MAP","KCl","Ureia","Calcário"],machines:[],tests:[]};
const save=()=>{try{localStorage.setItem("campo_v1",JSON.stringify(S))}catch(e){}};
S.points=S.points||[];S.groups=S.groups||[];
if(S.points.some(p=>!p.gid)){let g=S.groups.find(x=>x.id=="g0");if(!g){g={id:"g0",name:"Sem grupo"};S.groups.push(g)}S.points.forEach(p=>{if(!p.gid)p.gid="g0"});save()}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=(v,d=1)=>isFinite(v)?v.toFixed(d).replace(".",","):"–";
const AD={disco:"Discos (cm)",bica:"Bica / ponto de queda (unitário, aceita negativo)",palheta:"Palhetas (unitário, aceita negativo)"};
const col=c=>c<=10?"var(--ok)":c<=15?"var(--wa)":"var(--er)";
const M=id=>S.machines.find(m=>m.id==id);
let draft=null,cur=null;
function go(n,p){stopGPS();const mm=document.getElementById("pm");if(mm)mm.remove();document.body.style.overflow="";window.scrollTo(0,0);({home,fert,pontos,plista,pgrupo,backup,form,machine,test:newTest}[n])(p)}
function st(a){const n=a.length,m=a.reduce((x,y)=>x+y,0)/n,sd=Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(n-1));return{m,sd,cv:m>0?sd/m*100:0}}
function ovl(x,y,W){if(!(W>0)||x.length<2)return null;
 const f=p=>{if(p<x[0]||p>x[x.length-1])return 0;let i=1;while(p>x[i])i++;const t=(p-x[i-1])/(x[i]-x[i-1]);return y[i-1]+t*(y[i]-y[i-1])};
 const K=Math.ceil(Math.max(Math.abs(x[0]),x[x.length-1])/W)+1,a=[];
 for(let p=0;p<W;p+=W/200){let s=0;for(let k=-K;k<=K;k++)s+=f(p+k*W);a.push(s)}
 return st(a)}
function home(){app.innerHTML=`<h1>🌾 Campo</h1><div class="tiles"><div class="tile" onclick="go('fert')"><svg viewBox="0 0 64 64"><path d="M16 10h32l-7 22H23z"/><ellipse cx="32" cy="39" rx="11" ry="3.5"/><path d="M32 32v3.5"/><circle cx="12" cy="50" r="2" fill="var(--ac)"/><circle cx="22" cy="55" r="2" fill="var(--ac)"/><circle cx="32" cy="57" r="2" fill="var(--ac)"/><circle cx="42" cy="55" r="2" fill="var(--ac)"/><circle cx="52" cy="50" r="2" fill="var(--ac)"/></svg><b>Teste de distribuição de fertilizantes</b></div><div class="tile" onclick="go('pontos')"><svg viewBox="0 0 64 64"><path d="M32 6c-9.5 0-16 6.5-16 15 0 11 16 28 16 28s16-17 16-28c0-8.500-6.500-15-16-15z"/><circle cx="32" cy="21" r="5.500"/><ellipse cx="32" cy="56" rx="16" ry="4"/></svg><b>Coleta de pontos e amostras</b></div></div><button class="btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" onclick="go('backup')">Backup dos dados</button>`}
let gon=false,gw=null,gp=null,gerr="",coll=null,gt=null,gst="";
const gF=(v,d)=>v==null||!isFinite(v)?"–":v.toFixed(d);
function stopGPS(){try{if(gw!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gw)}catch(e){}gw=null;gon=false;clearTimeout(gt)}
function pontos(){coll=null;gp=null;gerr="";gst="";gpick=false;pk=null;ms=null;msWait=false;mtl=new Map();mfollow=true;gtl=0;gdk="";stopGPS();S.points=S.points||[];
 if(!MV){const lp=S.points[S.points.length-1];MV=lp?{fx:mFx(lp.lon),fy:mFy(lp.lat),z:17}:{fx:mFx(-51.9),fy:mFy(-14.2),z:4}}
 document.body.style.overflow="hidden";
 app.innerHTML=`<div id="mapv"><div id="mtiles"></div><svg id="mmark"></svg></div>
<button class="mfab mtop" style="left:10px;font-size:22px" onclick="pMenu()" aria-label="Menu">☰</button>
<button class="mfab mtop" style="right:10px" onclick="mLay()" aria-label="Camadas do mapa" title="Camadas do mapa">${IC.layers}</button>
<button class="mfab mtop" id="mrb" style="right:10px;top:calc(64px + env(safe-area-inset-top,0px))" onclick="mRul()" aria-label="Medir distância e área" title="Medir">${IC.ruler}</button>
<div id="mlay" class="mpop" style="top:calc(10px + env(safe-area-inset-top,0px))"><button class="mfab mlb" data-m="radar" onclick="gMode('radar')" aria-label="Radar" title="Radar">${IC.radar}</button><button class="mfab mlb" data-m="sat" onclick="gMode('sat')" aria-label="Satélite" title="Satélite">${IC.sat}</button><button class="mfab mlb" data-m="rua" onclick="gMode('rua')" aria-label="Mapa de ruas" title="Mapa de ruas">${IC.map}</button></div>
<div id="mrul" class="mpop" style="top:calc(64px + env(safe-area-inset-top,0px))"><button class="msb" onclick="msStart()">${IC.poly} Ponto a ponto</button></div>
<div id="mattr" class="mattr"></div><div id="mban" class="mban"></div><div id="mtoast"></div><div id="mdock"></div><div id="mmeas" class="mpanel"></div><div id="gpk" class="sheet" style="display:none"></div><div id="gres"></div>`;
 mInit();gMode(gmode,1);gDiag();mSched()}
let gdt="",gdk="";
function gDiag(){gdt=`Localização: ${navigator.geolocation?"disponível":"indisponível"} · conexão segura: ${window.isSecureContext?"sim":"não"} · dentro de outro quadro: ${window.self!==window.top?"sim":"não"}`;gdk="";gDock();
 try{navigator.permissions.query({name:"geolocation"}).then(r=>{gdt+=` · permissão: ${r.state}`;gdk="";gDock()}).catch(()=>{})}catch(e){}}
function gStart(){stopGPS();gp=null;gerr="";
 if(!navigator.geolocation){gerr="Este aparelho ou navegador não oferece localização.";gDraw();return}
 gon=true;gst="Aguardando permissão e sinal do GPS…";mfollow=true;gDraw();
 gt=setTimeout(()=>{if(!gp&&!gerr){gst="Ainda sem sinal. Vá para um local aberto e aguarde alguns segundos.";gDraw()}},15000);
 try{gw=navigator.geolocation.watchPosition(p=>{const first=!gp;gp=p;gerr="";gFix(first)},e=>{gerr=e.code==1?"Permissão de localização negada. Se o GPS do aparelho está ligado, o visualizador do claude.ai pode estar bloqueando a localização: abra o link do app direto no Chrome ou no Safari e toque em Permitir.":e.code==2?"Posição indisponível. Verifique se o GPS está ligado.":"Tempo esgotado ao obter a posição.";gDraw()},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}catch(e){gon=false;gerr="Não foi possível acessar a localização neste ambiente.";gDraw()}}
function gStop(){stopGPS();gp=null;gst="";gerr="";msWait=false;gDraw()}
function gDraw(){if(!$("#mapv"))return;gDock();mSched()}
function gFix(first){if(!$("#mapv"))return;if(first&&MV.z<15)MV.z=17;if(mfollow&&gp)mCenterOn(gp.coords.latitude,gp.coords.longitude);if(msWait&&gp){msWait=false;msAddPos()}gDock();mSched()}
function gDock(){const d=$("#mdock");if(!d)return;const er=gerr?`<p style="color:var(--er);margin:6px 0 0">${gerr}</p>`:"";
 const key=(gp?"fix":gon?"on:"+gst:"off:"+gdt)+"|"+gerr;
 if(gp){const c=gp.coords,co=`<small>POSIÇÃO ATUAL · WGS84</small><br><b>${gF(c.latitude,6)}, ${gF(c.longitude,6)}</b><br><small>precisão ± ${gF(c.accuracy,1)} m · <button class="lnk" style="padding:0;font-size:13px" onclick="gStop()">Parar GPS</button></small>`;
  if(key===gdk&&$("#gco")){$("#gco").innerHTML=co;return}gdk=key;
  d.innerHTML=mStack()+`<div class="mbar"><div class="mpanel mco" id="gco">${co}</div><button class="btn mcol" onclick="gCollect()">Coletar ponto</button></div>${er}`;return}
 if(key===gdk)return;gdk=key;
 d.innerHTML=mStack()+(!gon?`<div class="mpanel"><small>GPS DESLIGADO</small><p class="mut" style="margin:4px 0 0">Toque em Iniciar coleta para ligar o GPS do aparelho. O navegador vai pedir permissão de localização.</p>${er}<button class="btn" style="margin-top:8px" onclick="gStart()">Iniciar coleta</button><small class="mut" style="display:block;margin-top:8px">${gdt}</small></div>`:`<div class="mpanel"><small>GPS LIGADO</small><p style="margin:4px 0 0">${gst}</p>${er}${gerr?`<button class="lnk" onclick="gStart()">Tentar novamente</button> · `:""}<button class="lnk" onclick="gStop()">Parar</button></div>`)}
const mStack=()=>`<div class="mrow"><button class="mfab" aria-label="Centralizar na minha posição" title="Centralizar na minha posição" onclick="mCenter()">${IC.loc}</button><button class="msb" onclick="pkStart()">${IC.pin} Marcar no mapa</button></div>`;
function gresClear(){const g=$("#gres");if(g){g.className="";g.innerHTML=""}}
function toast(t){const e=$("#mtoast");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.display="none"},3500)}
function gCollect(){if(!gp)return;const c=gp.coords;coll={lat:c.latitude,lon:c.longitude,acc:c.accuracy,alt:c.altitude,altAcc:c.altitudeAccuracy,ts:gp.timestamp};gForm()}
function gForm(){const el=$("#gres");if(!el||!coll)return;el.className="sheet";
 el.innerHTML=`<b>Ponto coletado</b>
<p style="margin:8px 0">Datum: <b>WGS84</b><br>Latitude: <b>${gF(coll.lat,7)}</b><br>Longitude: <b>${gF(coll.lon,7)}</b>${coll.man?`<br>Origem: <b>marcado no mapa</b>`:`<br>Precisão horizontal: <b>± ${gF(coll.acc,1)} m</b>${coll.alt!=null?`<br>Altitude: <b>${gF(coll.alt,1)} m</b>${coll.altAcc!=null?` (± ${gF(coll.altAcc,1)} m)`:""}`:""}`}<br>Data e hora: <b>${new Date(coll.ts).toLocaleString("pt-BR")}</b></p>${!coll.man&&coll.acc>20?`<p style="color:var(--wa);margin:0 0 8px">Precisão acima de 20 m. Se puder, aguarde o GPS estabilizar e colete de novo.</p>`:""}
<label>Nome do ponto<input id="gname" value="Ponto ${(S.points||[]).length+1}"></label>
${grpPicker("ggrp","ggn",lastG)}
<label>Anotações<textarea id="gnote" rows="3" placeholder="Anotações relevantes sobre este ponto" style="width:100%;box-sizing:border-box;font-size:16px;padding:10px;margin-top:4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></textarea></label>
<p id="ggm" style="color:var(--er);margin:6px 0 0"></p><div class="row" style="margin-top:8px"><button class="sm" style="background:var(--mut)" onclick="coll=null;gresClear()">Descartar</button><button class="sm" onclick="gSave()">Salvar ponto</button></div>`}
function gSave(){if(!coll)return;const gid=grpResolve("ggrp","ggn");if(!gid){$("#ggm").textContent="Informe o nome do novo grupo.";return}
 S.points.push({id:Date.now().toString(36),...coll,datum:"WGS84",name:($("#gname").value||"").trim(),note:$("#gnote").value.trim(),gid});lastG=gid;save();coll=null;
 const g=S.groups.find(x=>x.id==gid);gresClear();toast(`Ponto salvo no grupo "${g.name}".`);gDraw()}
function askDelP(id){$("#p_"+id).innerHTML=`<b style="color:var(--er)">Excluir este ponto?</b><br>Este ponto não poderá ser recuperado.<div class="row" style="margin-top:8px"><button class="sm" style="background:var(--mut)" onclick="gList()">Cancelar</button><button class="sm" style="background:var(--er)" onclick="delP('${id}')">Excluir ponto</button></div>`}
function delP(id){gsel.delete(id);S.points=S.points.filter(p=>p.id!=id);save();gList();gDraw()}
function fert(){app.innerHTML=`<button class="lnk" onclick="go('home')">‹ Início</button><h2>Teste de distribuição de fertilizantes</h2>`+(S.machines.length?S.machines.map(m=>`<div class="card tap" onclick="go('machine','${m.id}')"><b>${esc(m.fleet)}</b> · ${esc(m.brand)} ${esc(m.model)}<br><small>${m.adj.map(a=>AD[a].split(" (")[0]).join(" + ")} · ${S.tests.filter(t=>t.mid==m.id).length} teste(s)</small></div>`).join(""):`<p class="mut">Nenhum equipamento cadastrado.</p>`)+`<button class="btn" onclick="go('form')">+ Adicionar equipamento</button>`}
function form(){app.innerHTML=`<button class="lnk" onclick="go('fert')">‹ Voltar</button><h2>Novo equipamento</h2>
<label>Frota / identificador<input id="fl" placeholder="DN257"></label>
<label>Marca<select id="br">${S.brands.map(b=>`<option>${esc(b)}</option>`).join("")}</select></label>
<div class="row"><input id="nb" placeholder="Nova marca"><button class="sm" onclick="addB()">+ Marca</button></div>
<label>Modelo<input id="md" placeholder="RG1300B"></label>
<p class="mut">Mecanismos de regulagem (marque um ou mais)</p>
${Object.keys(AD).map(k=>`<label class="chk"><input type="checkbox" class="ad" value="${k}"> ${AD[k]}</label>`).join("")}
<p id="err" style="color:var(--er)"></p><button class="btn" onclick="saveM()">Salvar equipamento</button>`}
function addB(){const v=$("#nb").value.trim(),fl=$("#fl").value,md=$("#md").value;if(v&&!S.brands.includes(v)){S.brands.push(v);save()}form();$("#fl").value=fl;$("#md").value=md;if(v)$("#br").value=v}
function saveM(){const fleet=$("#fl").value.trim(),model=$("#md").value.trim(),adj=[...document.querySelectorAll(".ad:checked")].map(e=>e.value);
 if(!fleet||!model||!adj.length){$("#err").textContent="Informe frota, modelo e ao menos um mecanismo.";return}
 const id=Date.now().toString(36);S.machines.push({id,fleet,brand:$("#br").value,model,adj});save();go("machine",id)}
function machine(id){const m=M(id),ts=S.tests.filter(t=>t.mid==id).reverse();

 hdr();pts.forEach((p,i)=>{if(y>800)hdr();if(i%2)g.rect(36,y-10,523,15,"#f3f4f6");g.text(44,y,String(p.name).slice(0,42),10);g.text(300,y,p.lat.toFixed(7),10);g.text(430,y,p.lon.toFixed(7),10);y+=15});return g.finish()}
async function gExp(k){const pts=gSet(),m=$("#gexm"),say=s=>{if(m)m.textContent=s};if(!pts.length)return say("Nenhum ponto para exportar.");
 const f=n=>n.toFixed(7),dc=n=>n.toFixed(7).replace(".",","),D=gd();let r;
 try{if(k=="csv")r=await dl(`pontos-${D}.csv`,"\ufeff"+["nome,latitude,longitude,precisao_m,altitude_m,data_hora,anotacoes",...pts.map(p=>[qc(p.name),f(p.lat),f(p.lon),p.acc==null?"":p.acc.toFixed(1),p.alt==null?"":p.alt.toFixed(1),qc(new Date(p.ts).toISOString()),qc(p.note)].join(","))].join("\r\n"));
 else if(k=="lcsv")r=await dl(`lista-pontos-${D}.csv`,"\ufeff"+["Nome;Latitude;Longitude",...pts.map(p=>[qc(p.name),dc(p.lat),dc(p.lon)].join(";"))].join("\r\n"));
 else if(k=="kml")r=await dl(`pontos-${D}.kml`,`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Pontos coletados</name>${pts.map(p=>`<Placemark><name>${xe(p.name)}</name><description>${xe((p.note?p.note+" | ":"")+(p.acc==null?"marcado no mapa":"precisão ± "+gF(p.acc,1)+" m")+" | "+new Date(p.ts).toLocaleString("pt-BR"))}</description><Point><coordinates>${f(p.lon)},${f(p.lat)},${p.alt!=null?p.alt.toFixed(1):0}</coordinates></Point></Placemark>`).join("")}</Document></kml>`);
 else if(k=="shp")r=await dl(`pontos-${D}-shp.zip`,mkShp(pts));
 else r=await dl(`lista-pontos-${D}.pdf`,mkLista(pts))}catch(e){r="erro"}
 say(r=="ok"?`Arquivo gerado (${pts.length} ponto(s)).`:r=="declined"?"Cancelado.":"Não foi possível salvar o arquivo.")}
function newTest(mid){const l=S.tests.filter(t=>t.mid==mid&&t.tipo!=="A").slice(-1)[0]||{};
 draft={mid,n:l.n||11,product:l.product||S.products[0],rate:l.rate||"",width:l.width||"",rpm:"",wind:"",adj:{},v:[]};
 draft.v=Array(draft.n).fill("");drawTest()}
function inp(l,k){return`<label>${l}<input type="number" step="any" inputmode="decimal" value="${draft[k]}" oninput="draft.${k}=this.value;calc()"></label>`}
function drawTest(){const m=M(draft.mid),D=draft;
 app.innerHTML=`<button class="lnk" onclick="go('machine','${m.id}')">‹ ${esc(m.fleet)}</button><h2>Teste de bandeja</h2>
<div class="card"><div class="g2"><label>Nº de bandejas<select onchange="setN(+this.value)">${[5,7,9,11,13,15,17,19,21].map(n=>`<option ${n==D.n?"selected":""}>${n}</option>`).join("")}</select></label>
<label>Produto<select onchange="draft.product=this.value">${S.products.map(p=>`<option ${p==D.product?"selected":""}>${esc(p)}</option>`).join("")}</select></label></div>
<div class="row"><input id="np" placeholder="Novo produto"><button class="sm" onclick="addP()">+ Produto</button></div>
<div class="g2">${inp("Taxa alvo (kg/ha)","rate")}${inp("Largura de trabalho (m)","width")}${inp("RPM dos discos","rpm")}${inp("Vento (km/h, opcional)","wind")}</div>
${m.adj.map(k=>`<label>${AD[k]}<input type="number" step="any" inputmode="decimal" placeholder="ex: -2,5" value="${D.adj[k]??""}" oninput="draft.adj['${k}']=this.value"></label>`).join("")}</div>
<div class="card"><b>Massa coletada (g)</b><p class="mut" style="margin:2px 0 8px">Da esquerda para a direita, com a máquina no centro.</p><div class="sg">${D.v.map((x,i)=>`<label>B${i+1}<input type="number" step="any" inputmode="decimal" value="${x}" oninput="draft.v[${i}]=this.value;calc()"></label>`).join("")}</div></div>
<div id="res"></div>`;calc()}
function setN(n){draft.n=n;draft.v=Array.from({length:n},(_,i)=>draft.v[i]??"");drawTest()}
function addP(){const v=$("#np").value.trim();if(v&&!S.products.includes(v)){S.products.push(v);save()}if(v)draft.product=v;drawTest()}
function calc(){const D=draft,el=$("#res");cur=null;
 const miss=D.v.filter(x=>x==="").length;
 if(miss)return el.innerHTML=`<p class="mut">Preencha todas as bandejas (${miss} faltando).</p>`;
 const y=D.v.map(Number),s=st(y),sp=+D.width>0?+D.width/(y.length-1):1,x=y.map((_,i)=>(i-(y.length-1)/2)*sp),o=+D.width>0?ovl(x,y,+D.width):null,main=o?o.cv:s.cv;
 const mx=Math.max(...y)*1.15||1,bw=300/y.length,my=140-s.m/mx*120;
 const bars=y.map((t,i)=>`<rect x="${20+i*bw+2}" y="${140-t/mx*120}" width="${bw-4}" height="${t/mx*120}" rx="2" fill="${col(main)}" opacity=".85"/><text x="${20+i*bw+bw/2}" y="154" font-size="9" text-anchor="middle" fill="var(--mut)">${i+1}</text>`).join("");
 const prev=S.tests.filter(t=>t.mid==D.mid&&t.tipo!=="A").slice(-1)[0],dl=prev?main-prev.main:null;
 cur={...D,tipo:"S",adj:{...D.adj},v:[...D.v],main,cv:s.cv,mean:s.m,date:new Date().toLocaleDateString("pt-BR"),id:Date.now().toString(36)};
 el.innerHTML=`<div class="card"><svg viewBox="0 0 340 160" width="100%">${bars}<line x1="20" x2="320" y1="${my}" y2="${my}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="320" y="${my-4}" font-size="10" text-anchor="end" fill="var(--ink)">média ${F(s.m)} g</text></svg></div>
<div class="card" style="border:2px solid ${col(main)}"><small>${o?`CV COM SOBREPOSIÇÃO (faixa de ${D.width} m)`:"CV DO PERFIL (informe a largura de trabalho para simular a sobreposição)"}</small><div class="big" style="color:${col(main)}">${F(main,2)}%</div>
<small>${main<=10?"Excelente (até 10%)":main<=15?"Aceitável (10% a 15%)":"Alta variabilidade (acima de 15%)"}</small>
${o?`<p style="margin:8px 0 0">CV do perfil das bandejas: <b>${F(s.cv,2)}%</b></p>`:""}
<p style="margin:4px 0 0">Média: <b>${F(s.m)} g</b> · Desvio padrão: <b>${F(s.sd)} g</b></p>
${dl!==null?`<p style="margin:4px 0 0">Teste anterior: ${F(prev.main,2)}% → <b style="color:${dl<=0?"var(--ok)":"var(--er)"}">${dl<=0?"melhorou":"piorou"} ${F(Math.abs(dl),2)} p.p.</b></p>`:""}</div>
<button class="btn" onclick="saveT()">Salvar teste no histórico</button>`}
function saveT(){if(!cur)return;S.tests.push(cur);save();go("machine",cur.mid)}
home();
</script><script>(function(){if(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)return;var el=document.createElement("div");el.style.cssText="font:12px system-ui,sans-serif;text-align:center;padding:14px;color:#94a3b8";document.body.appendChild(el);var dp=null,sw="verificando",mf="verificando";
function draw(){el.innerHTML="Instalação: manifesto "+mf+" · service worker "+sw+" · instalável pelo Chrome: "+(dp?"sim":"ainda não")+(dp?'<br><button id="ibtn" style="margin-top:8px;padding:10px 16px;border:0;border-radius:10px;background:#10b981;color:#fff;font-weight:700;font-size:15px">Instalar app</button>':"");var b=document.getElementById("ibtn");if(b)b.onclick=function(){dp.prompt();dp.userChoice.then(function(){dp=null;draw()})}}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;draw()});window.addEventListener("appinstalled",function(){el.remove()});
(window.fetch?fetch("manifest.webmanifest"):Promise.reject()).then(function(r){mf=r.ok?"ok":"erro "+r.status;draw()}).catch(function(){mf="erro";draw()});
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0){navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(){sw="ativo";draw()}).catch(function(){sw="erro";draw()})}else{sw="indisponível";draw()}draw()})();</script></body></html>
